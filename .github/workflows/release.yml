name: Release

on:
  push:
    tags:
      'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release'
        required: true
        default: 'v0.0.0-test'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
            artifact: verdandi-linux-amd64

          - os: macos-latest
            target: darwin_arm64
            artifact: verdandi-mac-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Build gifdec (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd vendor/gifdec
          cc -c -O2 -fPIC gifdec.c -o gifdec.o
          ar rcs libgifdec.a gifdec.o


      - name: Build miniaudio libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y make gcc
          make -C "$(odin root)/vendor/miniaudio/src"

      - name: Build miniaudio libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          make -C "$(odin root)/vendor/miniaudio/src"

      - name: Build external vendor applications (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd vendor/gifdec
          cc -c -O2 -fPIC gifdec.c -o gifdec.o
          ar rcs libgifdec.a gifdec.o
          cd ../stb_image_resize2
          cc -c -O2 -fPIC stb_resize_impl.c -o stb_resize.o
          ar rcs libstb_resize.a stb_resize.o

      - name: Build
        shell: bash
        run: odin build . -o:speed -out:${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
