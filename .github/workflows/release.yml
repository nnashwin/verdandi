name: Release

on:
  push:
    tags:
      'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
            artifact: verdandi-linux-amd64

          - os: windows-latest
            target: windows_amd64
            artifact: verdandi-windows-amd64.exe

          - os: macos-latest
            target: darwin_arm64
            artifact: verdandi-mac-arm64

          - os: macos-13
            target: darwin_amd64
            artifact: verdandi-mac-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Build gifdec (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd vendor/gifdec
          cc -c -O2 -fPIC gifdec.c -o gifdec.o
          ar rcs libgifdec.a gifdec.o

      - name: Build gifdec (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set VS=%%i
          call "!VS!\VC\Auxiliary\Build\vcvarsall.bat" amd64
          cd vendor\gifdec
          cl /c /O2 gifdec.c
          lib /OUT:gifdec.lib gifdec.obj

      - name: Build miniaudio libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y make gcc
          make -C "$(odin root)/vendor/miniaudio/src"

      - name: Build miniaudio libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          make -C "$(odin root)/vendor/miniaudio/src"

      - name: Build miniaudio (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set VS=%%i
          call "!VS!\VC\Auxiliary\Build\vcvarsall.bat" amd64
          pushd "%ODIN_ROOT%\vendor\miniaudio\src"
          call build.bat
          popd

      - name: Build external vendor applications (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd vendor/gifdec
          cc -c -O2 -fPIC gifdec.c -o gifdec.o
          ar rcs libgifdec.a gifdec.o
          cd ../stb_image_resize2
          cc -c -O2 -fPIC stb_resize.c -o stb_resize.o
          ar rcs libstb_resize.a stb_resize.o

      - name: Build gifdec (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "tokens=*" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set VS=%%i
        call "!VS!\VC\Auxiliary\Build\vcvarsall.bat" amd64
        cd vendor\gifdec
        cl /c /O2 gifdec.c
        lib /OUT:gifdec.lib gifdec.obj
        cd ..\stb_image_resize2
        cl /c /O2 stb_resize.c
        lib /OUT:libstb_resize.lib stb_resize.obj

      - name: Build
        shell: bash
        run: odin build . -o:speed -out:${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
